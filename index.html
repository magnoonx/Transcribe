<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
        }
        #subtitle-box {
            background-color: rgba(0, 0, 0, 0.5); /* Fondo semitransparente */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            padding: 10px 30px;
            border-radius: 10px;
            text-shadow: 2px 2px 4px #000000; /* Sombra para legibilidad */
            max-width: 90%;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <div id="subtitle-box">Esperando audio de VLC...</div>

    <script>
        const { ipcRenderer } = require('electron');
        const box = document.getElementById('subtitle-box');

        ipcRenderer.on('new-text', (event, text) => {
            box.innerText = text;
            
            // Opcional: Limpiar el texto después de 5 segundos de silencio
            clearTimeout(window.subtitleTimer);
            window.subtitleTimer = setTimeout(() => {
                box.innerText = "";
            }, 5000);
        });
    </script>
</body>
</html>
